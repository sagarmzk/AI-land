name: AIland
options:
  bundleIdPrefix: com.sagarmzk
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  AIland:
    type: application
    platform: iOS
    sources:
      - path: AIland/Sources
      - path: AIland/Resources/www
        type: folder
        buildPhase: resources
      - path: AIland/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: AIland/Info.plist
      properties:
        CFBundleName: AIland
        CFBundleDisplayName: AIland
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sagarmzk.ailand
        PRODUCT_NAME: AIland
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
schemes:
  AIland:
    build:
      targets:
        AIland: all
    run:
      config: Debug
    archive:
      config: Release
