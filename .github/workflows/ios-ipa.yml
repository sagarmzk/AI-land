name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ios-ipa]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild \
            -project AIland.xcodeproj \
            -scheme AIland \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          rm -rf Payload AIland-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AIland.app Payload/
          zip -qry AIland-unsigned.ipa Payload
          unzip -l AIland-unsigned.ipa
          ls -lh AIland-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AIland-ipa
          path: ios/AIland-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
